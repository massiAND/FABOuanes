services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: fabouanes_web
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Configure DATABASE_URL for this machine}"
      SECRET_KEY: change_me_in_production
      SESSION_COOKIE_SECURE: "0"
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: ""
      WEB_CONCURRENCY: "1"
      FAB_PG_POOL_SIZE: "10"
      FAB_PG_POOL_MAX_OVERFLOW: "10"
    ports:
      - "8000:8000"
    command: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:8000 app.main:app
