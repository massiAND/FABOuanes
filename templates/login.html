{% extends 'base.html' %}
{% block content %}
<style>
  .login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef3f8;}
  [data-theme="dark"] .login-page{background:#0f172a;}
  .login-card{width:min(100%,380px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 22px 55px rgba(15,23,42,.14);}
  .login-logo{display:block;width:82px;height:82px;object-fit:contain;margin:0 auto 22px;border-radius:18px;}
  .login-alert{margin-bottom:16px;border-radius:8px;font-size:.88rem;font-weight:600;}
  .login-field{margin-bottom:14px;}
  .login-label{display:block;margin-bottom:7px;color:var(--text);font-size:.88rem;font-weight:700;}
  .login-input-wrap{position:relative;}
  .login-input-wrap>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none;}
  .login-input{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:.95rem;font-weight:600;padding:0 42px;}
  .login-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .toggle-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;}
  .toggle-pass:hover{background:rgba(37,99,235,.08);color:#2563eb;}
  .login-options{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;}
  .remember-check{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;font-weight:600;}
  .remember-check input{width:16px;height:16px;accent-color:#2563eb;}
  .btn-login{width:100%;height:48px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:.96rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;}
  .btn-login:hover{background:#1e40af;}
  @media(max-width:575px){.login-page{padding:16px}.login-card{padding:22px}.login-logo{width:74px;height:74px;margin-bottom:18px}}
</style>

<div class="login-page">
  <main class="login-card" aria-label="Connexion">
    <img src="{{ url_for('static', filename='desktop_logo_shield.png') }}" alt="FABOuanes" class="login-logo">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} login-alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="login-field">
        <label class="login-label" for="usernameInput">Utilisateur</label>
        <div class="login-input-wrap">
          <i class="bi bi-person"></i>
          <input id="usernameInput" name="username" type="text" class="login-input" autocomplete="username" placeholder="Identifiant" required>
        </div>
      </div>

      <div class="login-field">
        <label class="login-label" for="passwordInput">Mot de passe</label>
        <div class="login-input-wrap">
          <i class="bi bi-key"></i>
          <input id="passwordInput" name="password" type="password" class="login-input" autocomplete="current-password" placeholder="********" required>
          <button type="button" class="toggle-pass" id="togglePassword" aria-label="Afficher le mot de passe">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-check">
          <input type="checkbox" name="remember"> Se souvenir de moi
        </label>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right"></i>
        Se connecter
      </button>
    </form>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!localStorage.getItem('fab_theme')) {
  localStorage.setItem('fab_theme', 'light');
  document.documentElement.setAttribute('data-theme', 'light');
}
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('passwordInput');
if (togglePassword && passwordInput) {
  togglePassword.addEventListener('click', function () {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    this.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
  });
}
</script>
{% endblock %}
