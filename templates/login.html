{% extends 'base.html' %}
{% block content %}
<style>
  .login-page{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef4ff 0%,#f8fafc 48%,#effaf4 100%);}
  [data-theme="dark"] .login-page{background:linear-gradient(135deg,#0f172a 0%,#111827 54%,#0b1220 100%);}
  .login-card{width:min(100%,430px);background:var(--card);border:1px solid rgba(148,163,184,.22);border-radius:10px;padding:30px;box-shadow:0 24px 70px rgba(15,23,42,.16);}
  .login-brand{display:grid;justify-items:center;gap:12px;margin-bottom:22px;text-align:center;}
  .login-logo-frame{width:min(100%,250px);aspect-ratio:1408/768;display:grid;place-items:center;padding:10px;border-radius:10px;background:#fff;border:1px solid rgba(148,163,184,.22);box-shadow:0 14px 32px rgba(15,23,42,.08);}
  .login-logo{display:block;width:100%;height:100%;object-fit:contain;}
  .login-title{margin:0;font-size:1.28rem;line-height:1.15;font-weight:900;color:var(--text);}
  .login-subtitle{margin:4px 0 0;color:var(--muted);font-size:.9rem;font-weight:700;}
  [data-theme="dark"] .login-logo-frame{background:#fff;border-color:rgba(148,163,184,.22);box-shadow:0 18px 38px rgba(0,0,0,.24);}
  .login-alert{margin-bottom:16px;border-radius:8px;font-size:.88rem;font-weight:600;}
  .login-field{margin-bottom:14px;}
  .login-label{display:block;margin-bottom:7px;color:var(--text);font-size:.88rem;font-weight:700;}
  .login-input-wrap{position:relative;}
  .login-input-wrap>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none;}
  .login-input{width:100%;height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:.95rem;font-weight:600;padding:0 42px;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;}
  [data-theme="dark"] .login-input{background:#0d1117;}
  .login-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .toggle-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;}
  .toggle-pass:hover{background:rgba(37,99,235,.08);color:#2563eb;}
  .login-options{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;}
  .remember-check{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;font-weight:600;}
  .remember-check input{width:16px;height:16px;accent-color:#2563eb;}
  .btn-login{width:100%;height:48px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:.96rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 12px 26px rgba(37,99,235,.24);transition:background .15s ease,transform .15s ease,box-shadow .15s ease;}
  .btn-login:hover{background:#1e40af;transform:translateY(-1px);box-shadow:0 15px 30px rgba(37,99,235,.28);}
  .btn-login:active{transform:translateY(0);}
  @media(max-width:575px){.login-page{padding:16px}.login-card{padding:24px}.login-logo-frame{width:min(100%,220px)}}
</style>

<div class="login-page">
  <main class="login-card" aria-label="Connexion">
    <div class="login-brand">
      <div class="login-logo-frame">
        <img src="{{ url_for('static', filename='dashboard.png') }}" alt="FABOuanes" class="login-logo" loading="eager" decoding="async">
      </div>
      <div>
        <h1 class="login-title">Connexion</h1>
        <p class="login-subtitle">Acces a FABOuanes</p>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} login-alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="login-field">
        <label class="login-label" for="usernameInput">Utilisateur</label>
        <div class="login-input-wrap">
          <i class="bi bi-person"></i>
          <input id="usernameInput" name="username" type="text" class="login-input" autocomplete="username" placeholder="Identifiant" required>
        </div>
      </div>

      <div class="login-field">
        <label class="login-label" for="passwordInput">Mot de passe</label>
        <div class="login-input-wrap">
          <i class="bi bi-key"></i>
          <input id="passwordInput" name="password" type="password" class="login-input" autocomplete="current-password" placeholder="********" required>
          <button type="button" class="toggle-pass" id="togglePassword" aria-label="Afficher le mot de passe">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-check">
          <input type="checkbox" name="remember"> Se souvenir de moi
        </label>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right"></i>
        Se connecter
      </button>
    </form>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!localStorage.getItem('fab_theme')) {
  localStorage.setItem('fab_theme', 'light');
  document.documentElement.setAttribute('data-theme', 'light');
}
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('passwordInput');
if (togglePassword && passwordInput) {
  togglePassword.addEventListener('click', function () {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    this.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
  });
}
</script>
{% endblock %}
